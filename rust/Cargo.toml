[workspace]
members = ["crates/minidora-domain", "crates/minidora-engine", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.7.0-alpha.11"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
aho-corasick = "1.1"
base64 = "=0.22.1"
lopdf = { version = "=0.47.0", default-features = false }
jbonsai = "=0.4.2"
jpreprocess = "=0.16.0"
roxmltree = "=0.21.2"
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minidora-domain = { path = "crates/minidora-domain" }
minidora-engine = { path = "crates/minidora-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-value = "0.7"
sha2 = "0.10"
thiserror = "2.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde", "num-bigint"] }
num-traits = "0.2"
unicode-normalization = "0.1"
regex = "1.11"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
url = "2.5"

# The normal launcher uses the dev profile. Keep exact journal validation
# practical without changing the lifecycle, deadline or canonical bytes.
[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
