[workspace]
members = ["crates/minidora-domain", "crates/minidora-engine", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.7.0-alpha.4"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
minidora-domain = { path = "crates/minidora-domain" }
minidora-engine = { path = "crates/minidora-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-value = "0.7"
sha2 = "0.10"
thiserror = "2.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde", "num-bigint"] }
num-traits = "0.2"
unicode-normalization = "0.1"
regex = "1.11"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
url = "2.5"
